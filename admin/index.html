<!doctype html><html lang="mn"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-gtvgaPhDePX7uI4jX11xzptf'; connect-src https://bataar-sanctuary-payments.erdii4812.workers.dev; style-src 'unsafe-inline'; form-action 'self'; base-uri 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Батаарын өлгий — QPay удирдлага</title>
<style>body{font:16px system-ui;max-width:900px;margin:32px auto;padding:20px;color:#16302a}input,button{font:inherit;padding:10px;margin:6px 0}label{display:block}button{cursor:pointer}table{border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd}a{color:#075985}#message{white-space:pre-wrap}input[type=text],input[type=password]{width:min(90%,400px)}</style>
<h1>QPay төлбөрийн удирдлага</h1><p>Бааз захиалгын боломж болон эцсийн үнийг баталсны дараа үнийн санал үүсгэнэ. Нэхэмжлэх үүсгэх товч QPay руу хүсэлт илгээнэ.</p>
<form id="login"><label>Админы нууц түлхүүр <input id="token" type="password" autocomplete="off" required></label><button>Нэвтрэх</button></form>
<section id="workspace" hidden><button id="logout">Гарах</button><button id="providerHealth">QPay холболт шалгах</button><h2>Ирсэн захиалгын хүсэлтүүд</h2><label><input type="checkbox" id="showTests"> Туршилтын захиалгуудыг харуулах</label><table><thead><tr><th>Зочин</th><th>Огноо / хүн</th><th>Төлөв</th><th>Батлах</th></tr></thead><tbody id="bookings"></tbody></table><h2>Төлбөрийн үнийн санал</h2><form id="quote"><label>Захиалгын дугаар / тайлбар <input id="reference" type="text" maxlength="120" required></label><label>Эцсийн дүн (₮) <input id="amount" type="number" min="1" max="1000000000" step="1" required></label><label><input id="availability" type="checkbox" required> Бааз захиалгын боломж болон үнийг шалгаж баталсан</label><button id="create">Баталсан үнийн санал үүсгэх</button></form><button id="refresh">Төлөв шинэчлэх</button><table><thead><tr><th>Захиалга</th><th>Дүн</th><th>Төлөв</th><th>Үйлдэл</th></tr></thead><tbody id="rows"></tbody></table></section><p id="message" role="status" aria-live="polite"></p>
<script nonce="gtvgaPhDePX7uI4jX11xzptf">
'use strict';
let token = '';
let loginBusy=false;
const get = id => document.getElementById(id);
const message = value => { get('message').textContent = value; };
async function request(path, body) {
  const response = await fetch("https://bataar-sanctuary-payments.erdii4812.workers.dev" + path, {method:body ? 'POST' : 'GET', credentials:'omit', cache:'no-store', headers:{Authorization:'Bearer ' + token, ...(body ? {'Content-Type':'application/json'} : {})}, ...(body ? {body:JSON.stringify(body)} : {})});
  if (!response.ok) { if (response.status === 401) logout(); throw new Error(response.status === 401 ? 'Токен буруу эсвэл хүчингүй байна.' : 'Хүсэлт амжилтгүй (' + response.status + '). Нэхэмжлэхийг дахин үүсгэхээс өмнө төлөвийг шалгана уу.'); }
  return response.json();
}
function logout() { token=''; get('token').value=''; get('rows').replaceChildren(); get('bookings').replaceChildren(); get('workspace').hidden=true; get('login').hidden=false; message('Системээс гарлаа.'); }
function paymentLink(cell, url) {
  const parsed = new URL(url, location.origin);
  if (parsed.origin !== "https://bataar-sanctuary-payments.erdii4812.workers.dev" || !parsed.pathname.startsWith('/pay/')) throw new Error('Төлбөрийн холбоосын хаяг тохирохгүй байна.');
  const link = document.createElement('a'); link.href=parsed.href; link.textContent='Төлбөрийн холбоос'; link.target='_blank'; link.rel='noreferrer noopener'; cell.append(link);
}
let testBookingIds=new Set();
const stateLabel=value=>({pending:'Батлах хүлээж байна',approved:'Баталсан',awaiting_payment:'Төлбөр хүлээж байна',paid:'Төлбөр баталгаажсан',needs_review:'Шалгах шаардлагатай',creating:'Нэхэмжлэх бэлдэж байна'}[value]||value);
async function refreshQuotes() {
  const quotes = await request('/admin/quotes'); get('rows').replaceChildren();
  for (const item of quotes) {
    if(!get('showTests').checked&&(/^(SYSTEM|TEST)/.test(item.reference)||testBookingIds.has(item.id)))continue;
    const row=document.createElement('tr');
    for (const value of [item.reference.startsWith('Booking ')?'Захиалга '+item.id.slice(0,8):item.reference, Number(item.amount).toLocaleString() + ' ₮', stateLabel(item.status)]) { const cell=document.createElement('td'); cell.textContent=value; row.append(cell); }
    const action=document.createElement('td'); row.append(action);
    if (item.paymentUrl) paymentLink(action,item.paymentUrl);
    if (item.status === 'paid') {
      const email=document.createElement('a');
      email.href='mailto:erdii4812@gmail.com?subject='+encodeURIComponent('Төлбөр баталгаажсан: '+item.reference)+'&body='+encodeURIComponent('Захиалга: '+item.reference+'\nДүн: '+item.amount+' ₮\nТөлөв: Төлбөр баталгаажсан\nЗахиалгын дугаар: '+item.id);
      email.textContent='Баталгаажсан төлбөрийн имэйл бэлдэх (автоматаар илгээхгүй)'; action.append(email);
    }
    if (item.status === 'approved' || item.status === 'awaiting_payment' || item.status === 'paid') {
      const button=document.createElement('button'); button.textContent=item.status === 'approved' ? 'QPay нэхэмжлэх үүсгэх' : 'Холбоос авах';
      button.onclick=async () => {
        if (item.status === 'approved' && !confirm('Энэ захиалгад ' + item.amount + ' ₮ дүнтэй QPay нэхэмжлэх үүсгэх үү?')) return;
        button.disabled=true;
        try { const result=await request('/admin/quotes/' + encodeURIComponent(item.id) + '/invoice', {}); await refresh(); message('Төлөв: ' + stateLabel(result.status)); }
        catch(error) { message(error.message); } finally { button.disabled=false; }
      }; action.append(button);
    }
    if(item.status==='awaiting_payment'){const verify=document.createElement('button');verify.textContent='Төлбөр шалгах';verify.onclick=async()=>{verify.disabled=true;try{const result=await request('/admin/quotes/'+encodeURIComponent(item.id)+'/verify',{});await refresh();message(stateLabel(result.status));}catch(error){message(error.message);}finally{verify.disabled=false;}};action.append(verify);}
    get('rows').append(row);
  }
}
async function refreshBookings() {
  const items=await request('/admin/bookings'); get('bookings').replaceChildren();
  testBookingIds=new Set(items.filter(item=>/^SYSTEM.*TEST/.test(item.name)).map(item=>item.quote_id).filter(Boolean));
  for (const item of items) {
    if(!get('showTests').checked&&/^SYSTEM.*TEST/.test(item.name))continue;
      let pricing=null;try{pricing=item.pricing?JSON.parse(item.pricing):null;}catch{};
    const row=document.createElement('tr');
    for (const value of [item.name+' / '+item.email+' / '+(item.phone||''), (item.check_in||item.arrival)+' — '+(item.check_out||item.departure)+' / '+(item.guests||item.persons)+' хүн', stateLabel(item.status)]) {
      const cell=document.createElement('td'); cell.textContent=value; row.append(cell);
    }
    const action=document.createElement('td'); row.append(action);
    if (item.quote_id) { action.textContent='Баталсан · '+item.quote_id.slice(0,8)+' ';  }
    else {
      const form=document.createElement('form');
      const amountLabel=document.createElement('label'); amountLabel.textContent='Эцсийн дүн (₮)';
      const amount=document.createElement('input'); amount.type='number'; amount.min='1'; amount.max='1000000000'; amount.step='1'; amount.required=true; if(pricing)amount.value=String(pricing.amount); amountLabel.append(amount);
      const confirmation=document.createElement('label'); const checkbox=document.createElement('input'); checkbox.type='checkbox'; checkbox.required=true;
      confirmation.append(checkbox,document.createTextNode(' Бааз боломж болон үнийг шалгаж баталсан'));
      const button=document.createElement('button'); button.textContent='Захиалгыг батлах'; form.append(amountLabel,confirmation,button);
      form.onsubmit=async event=>{event.preventDefault();button.disabled=true;try {
        await request('/admin/bookings/'+encodeURIComponent(item.id)+'/approve',{amount:Number(amount.value),availabilityConfirmed:checkbox.checked});
        await refresh();message('Захиалгыг баталлаа. Доорх үнийн саналд QPay нэхэмжлэх үүсгэнэ.');
      } catch(error) {message(error.message);} finally {button.disabled=false;} };
      action.append(form);
    }
    if(item.bookingUrl){const customer=document.createElement('a');customer.href=item.bookingUrl;customer.textContent='Харилцагчийн захиалгын төлөв';customer.target='_blank';customer.rel='noopener noreferrer';action.append(customer);}
      if(pricing){const summary=document.createElement('p');summary.textContent=pricing.roomName+' · '+pricing.rooms+' өрөө · '+pricing.nights+' хоног · '+Number(pricing.daily).toLocaleString()+' ₮ / хоног · Нийт '+Number(pricing.amount).toLocaleString()+' ₮ (байр + 3 хоол)';action.append(summary);}
      if (item.message) {const note=document.createElement('details');const title=document.createElement('summary');title.textContent='Нэмэлт хүсэлт';const text=document.createElement('p');text.textContent=item.message;note.append(title,text);action.append(note);}
    get('bookings').append(row);
  }
}
async function refresh(){await refreshBookings();await refreshQuotes();}
get('showTests').onchange=()=>refresh().catch(error=>message(error.message));
get('login').onsubmit=async event => { event.preventDefault(); if(loginBusy)return;loginBusy=true;const loginButton=get('login').querySelector('button');loginButton.disabled=true;token=get('token').value; get('token').value=''; try { await refresh(); get('login').hidden=true; get('workspace').hidden=false; message('Нэвтэрлээ.'); } catch(error) { token=''; message(error.message); } finally{loginBusy=false;loginButton.disabled=false;} };
get('logout').onclick=logout;
get('refresh').onclick=() => refresh().then(() => message('Төлөв шинэчлэгдлээ.')).catch(error => message(error.message));
get('providerHealth').onclick=async ()=>{get('providerHealth').disabled=true;try {const result=await request('/admin/provider/health');message(result.authenticated?'QPay холболт баталгаажлаа.':'QPay холболт баталгаажаагүй.');}catch(error){message(error.message);}finally{get('providerHealth').disabled=false;}};
get('quote').onsubmit=async event => { event.preventDefault(); get('create').disabled=true; try { const result=await request('/admin/quotes', {reference:get('reference').value.trim(),amount:Number(get('amount').value),availabilityConfirmed:get('availability').checked}); await refresh(); get('quote').reset(); message('Үнийн санал үүслээ. Дараагийн алхам: QPay нэхэмжлэх үүсгэх.'); } catch(error) { message(error.message); } finally { get('create').disabled=false; } };
</script></html>
