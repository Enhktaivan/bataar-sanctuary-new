    <script>
      (function() {
        function adjustDesktopViewport() {
          var meta = document.getElementById('viewport-meta');
          if (!meta) return;
          var w = window.screen.width || window.innerWidth || 390;
          if (w < 1280) {
            var scale = Math.min(1, Math.max(0.2, w / 1280));
            meta.setAttribute('content', 'width=1280, initial-scale=' + scale + ', minimum-scale=0.2, maximum-scale=5.0, user-scalable=yes');
          } else {
            meta.setAttribute('content', 'width=device-width, initial-scale=1.0');
          }
        }
        adjustDesktopViewport();
        window.addEventListener('resize', adjustDesktopViewport);
        window.addEventListener('orientationchange', function() {
          setTimeout(adjustDesktopViewport, 150);
        });
      })();
    </script>
